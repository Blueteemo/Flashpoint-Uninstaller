name: Windows validation & release
on:
  push:
    branches: [main, 'develop/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Refine and validate the v2.0.0 icon
        run: |
          python -m pip install "Pillow>=10,<13"
          python tools/refine_icon.py
      - name: Unit and safety tests
        run: python -m unittest discover -s tests -v
      - name: Syntax check
        run: python -m compileall -q flashpoint_uninstaller launch_v2.py
      - name: Build Windows 64-bit executable
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.10,<7"
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Flashpoint-Uninstaller --icon assets/icon_v2.ico --add-data "assets/icon_v2.ico;assets" launch_v2.py
      - name: Verify EXE and smoke test launch
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/Flashpoint-Uninstaller.exe'
          if (!(Test-Path $exe)) { throw 'EXE is missing' }
          if ((Get-Item $exe).Length -lt 1000000) { throw 'EXE is unexpectedly small' }
          $proc = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 6
            $proc.Refresh()
            if ($proc.HasExited) { throw "GUI process exited unexpectedly: $($proc.ExitCode)" }
            Write-Host "Windows EXE launched successfully (PID $($proc.Id))."
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Flashpoint-Uninstaller-2.0-win64
          path: dist/Flashpoint-Uninstaller.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Flashpoint-Uninstaller-2.0-icons
          path: |
            assets/icon_v2.ico
            assets/icon_v2.png
          if-no-files-found: error
  publish-release:
    needs: windows-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[v2.0.0-icon-refresh]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Flashpoint-Uninstaller-2.0-win64
          path: release-files
      - uses: actions/download-artifact@v4
        with:
          name: Flashpoint-Uninstaller-2.0-icons
          path: fixed-icon
      - name: Commit corrected README and executable icon resources
        run: |
          set -euo pipefail
          cp fixed-icon/icon_v2.ico assets/icon_v2.ico
          cp fixed-icon/icon_v2.png assets/icon_v2.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/icon_v2.ico assets/icon_v2.png
          if ! git diff --cached --quiet; then
            git commit -m 'fix(assets): align transparent README and EXE icons for v2.0.0'
            git push origin HEAD:main
          fi
      - name: Replace existing v2.0.0 EXE with verified visual-only build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s release-files/Flashpoint-Uninstaller.exe
          gh release view v2.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload v2.0.0 release-files/Flashpoint-Uninstaller.exe --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit v2.0.0 --repo "$GITHUB_REPOSITORY" \
            --title 'Flashpoint 一键卸载 v2.0.0' \
            --notes-file .github/RELEASE_NOTES_2.0.md
          echo "Corrected visual-only v2.0.0 SHA-256:"
          sha256sum release-files/Flashpoint-Uninstaller.exe
          gh release view v2.0.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'Flashpoint-Uninstaller.exe'
