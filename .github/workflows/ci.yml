name: Windows validation & release
on:
  push:
    branches: [main, 'develop/**', 'fix/v2-postrelease-audit-20261028']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Unit and safety tests
        run: python -m unittest discover -s tests -v
      - name: Syntax check
        run: python -m compileall -q flashpoint_uninstaller launch_v2.py
      - name: Build Windows 64-bit executable
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.10,<7"
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Flashpoint-Uninstaller --icon assets/icon_v2.ico --add-data "assets/icon_v2.ico;assets" launch_v2.py
      - name: Verify EXE and smoke test launch
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/Flashpoint-Uninstaller.exe'
          if (!(Test-Path $exe)) { throw 'EXE is missing' }
          if ((Get-Item $exe).Length -lt 1000000) { throw 'EXE is unexpectedly small' }
          $proc = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 6
            $proc.Refresh()
            if ($proc.HasExited) { throw "GUI process exited unexpectedly: $($proc.ExitCode)" }
            Write-Host "Windows EXE launched successfully (PID $($proc.Id))."
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Flashpoint-Uninstaller-2.0-win64
          path: dist/Flashpoint-Uninstaller.exe
          if-no-files-found: error
  publish-release:
    needs: windows-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Flashpoint-Uninstaller-2.0-win64
          path: release-files
      - name: Synchronize existing v2.0.0 release notes in Chinese
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s release-files/Flashpoint-Uninstaller.exe
          if gh release view v2.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # This job only updates the already-published historical notes.
            # It NEVER overwrites the published executable or creates a new
            # release based solely on a push to main.
            gh release edit v2.0.0 --repo "$GITHUB_REPOSITORY" \
              --title 'Flashpoint 一键卸载 v2.0.0' \
              --notes-file .github/RELEASE_NOTES_2.0.md
            gh release view v2.0.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'Flashpoint-Uninstaller.exe'
          else
            echo 'Missing v2.0.0 release. No automatic release creation.'
            exit 1
          fi

  refresh-icon-assets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/v2-postrelease-audit-20261028'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2-postrelease-audit-20261028
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh PNG and ICO from the approved artwork
        run: |
          python -m pip install 'pillow>=11,<12'
          python tools/refresh_icon_assets.py
      - name: Commit corrected assets to working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon_v2.png assets/icon_v2.ico
          if git diff --cached --quiet; then
            echo 'Icon assets already consistent.'
          else
            git commit -m 'assets: correct icon transparency and crop'
            git push origin HEAD:fix/v2-postrelease-audit-20261028
          fi
