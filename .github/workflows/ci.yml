name: Windows validation & preview build
on:
  push:
    branches: [main, 'develop/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Unit and safety tests
        run: python -m unittest discover -s tests -v
      - name: Syntax check
        run: python -m compileall -q flashpoint_uninstaller launch_v2.py
      - name: Build Windows 64-bit preview
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.10,<7"
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Flashpoint-Uninstaller-2.0-preview --icon assets/icon_v2.ico --add-data "assets/icon_v2.ico;assets" launch_v2.py
      - name: Verify EXE artifact exists
        shell: pwsh
        run: |
          $exe = 'dist/Flashpoint-Uninstaller-2.0-preview.exe'
          if (!(Test-Path $exe)) { throw 'EXE is missing' }
          Write-Host "Preview size: $((Get-Item $exe).Length) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: Flashpoint-Uninstaller-2.0-preview-win64
          path: dist/Flashpoint-Uninstaller-2.0-preview.exe
          if-no-files-found: error
