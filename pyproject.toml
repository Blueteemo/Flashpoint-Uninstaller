[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashpoint-uninstaller"
version = "2.0.1"
description = "An independent, safety-first Flashpoint Archive uninstaller for Windows"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["flashpoint_uninstaller*"]
